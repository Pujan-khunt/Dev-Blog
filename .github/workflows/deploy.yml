name: Deploy to Cloudflare Pages

# Trigger for this workflow to run
on:
  push:
    branches: ["main"]

  # Allows to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Manages behavior when multiple runs of this workflow are triggered
concurrency:
  # Creates a lock named "pages" which will prevent consecutive workflows from running
  # together and instead create a queue with only one workflow executing at a time.
  group: "pages"
  # If a workflow is executing and another workflow is triggered, then the workflow
  # in progress wouldn't be cancelled so the site remains consistent.
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Limit the abilities of this current workflow to follow the principle of least privilege
    permissions:
      # Grants access to read repository files and prevents writes. (required for actions/checkout@v4)
      contents: read
      # Allows to create a deployment entry in the repository sidebar.
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: pnpm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.BUILD_PATH }}/dist --project-name=dev-blog
          githubToken: ${{ secrets.GITHUB_TOKEN }}
